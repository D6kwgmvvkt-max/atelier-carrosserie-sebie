<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Carrosserie Sébie</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f2f2f7;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.container{
  padding:15px;
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:20px;
}

input[type=text],
input[type=email],
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
  margin-bottom:10px;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 16px;
  font-size:16px;
  margin:4px 0;
  cursor:pointer;
}

.primary{
  background:#007aff;
  color:white;
  width:100%;
}

.scanner{
  background:#5856d6;
  color:white;
  width:100%;
}

.voice{
  background:#ff2d55;
  color:white;
  width:100%;
}

.green{
  background:#34c759;
  color:white;
}

.orange{
  background:#ff9500;
  color:white;
}

.gray{
  background:#8e8e93;
  color:white;
}

.red{
  background:#ff3b30;
  color:white;
}

.info{
  background:#eef6ff;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  margin-bottom:10px;
}

.status{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
  font-size:14px;
  text-align:center;
}

.vehicle{
  background:#f8f8f8;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.vehicle-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.photos{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.photo-box{
  position:relative;
  background:white;
  border-radius:10px;
  padding-bottom:8px;
  overflow:hidden;
}

.photo-box img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px 10px 0 0;
  display:block;
}

.delete-photo{
  position:absolute;
  top:5px;
  right:5px;
  background:#ff3b30;
  color:white;
  border-radius:50%;
  width:32px;
  height:32px;
  padding:0;
  font-size:18px;
}

.photo-comment{
  padding:8px;
  font-size:13px;
  color:#333;
  min-height:35px;
}

.photo-comment-empty{
  color:#888;
  font-style:italic;
}

.comment-buttons{
  padding:0 8px;
}

.comment-buttons button{
  width:100%;
  font-size:13px;
  padding:9px;
}

.email-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.email-row label{
  flex:1;
  word-break:break-all;
}

.small-delete{
  background:#ff3b30;
  color:white;
  padding:7px 10px;
  font-size:13px;
}

.empty{
  color:#777;
  text-align:center;
  padding:10px;
}

.file-input{
  display:none;
}

.share-buttons{
  margin-top:10px;
}

.tip{
  background:#fff3cd;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
<h1>🚗 Atelier Carrosserie Sébie</h1>
</header>

<div class="container">

<!-- =====================================================
     NOUVEAU VÉHICULE
===================================================== -->

<div class="card">

<h2>➕ Nouveau véhicule</h2>

<div class="info">
📷 Tu peux scanner l'immatriculation.
<br><br>
🎙️ Ou utiliser le micro du clavier de l'iPhone.
</div>

<button
class="scanner"
onclick="ouvrirScanner()">
📷 Scanner l'immatriculation
</button>

<input
id="scannerImmatriculation"
type="file"
class="file-input"
accept="image/*"
capture="environment"
onchange="scannerPhoto(this)">

<div
id="scannerStatus"
class="status">
</div>

<input
id="immatriculation"
type="text"
placeholder="Exemple : AB-123-CD"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
maxlength="9"
oninput="formatImmatriculation(this)">

<button
class="voice"
onclick="activerClavierImmatriculation()">
🎙️ Dicter avec le clavier de l'iPhone
</button>

<div class="tip">
Après avoir appuyé sur le bouton, appuie sur
<strong>🎙️ le micro du clavier de l'iPhone</strong>
et dis par exemple :
<strong>« AB 123 CD »</strong>
</div>

<button
class="primary"
onclick="ajouterVehicule()">
➕ Ajouter le véhicule
</button>

</div>


<!-- =====================================================
     EMAILS
===================================================== -->

<div class="card">

<h2>📧 Adresses e-mail</h2>

<input
id="nouvelEmail"
type="email"
placeholder="adresse@email.com"
autocomplete="email">

<button
class="primary"
onclick="ajouterEmail()">
➕ Ajouter une adresse
</button>

<div id="listeEmails"></div>

</div>


<!-- =====================================================
     VÉHICULES
===================================================== -->

<div class="card">

<h2>🚘 Mes véhicules</h2>

<div id="listeVehicules"></div>

</div>

</div>


<script>

/* =====================================================
   DONNÉES
===================================================== */

let vehicules=JSON.parse(
localStorage.getItem(
"atelierCarrosserieVehicules"
)||"[]"
);

let emails=JSON.parse(
localStorage.getItem(
"atelierCarrosserieEmails"
)||"[]"
);


/* =====================================================
   MIGRATION DES PHOTOS
===================================================== */

vehicules.forEach(vehicle=>{

if(!Array.isArray(vehicle.photos)){
vehicle.photos=[];
}

vehicle.photos=vehicle.photos.map(photo=>{

if(typeof photo==="string"){
return{
image:photo,
commentaire:""
};
}

return photo;

});

});

sauvegarderVehicules();


/* =====================================================
   CLAVIER IPHONE — IMMATRICULATION
===================================================== */

function activerClavierImmatriculation(){

const input=
document.getElementById(
"immatriculation"
);

input.focus();

input.select();

}


/* =====================================================
   SCANNER
===================================================== */

function ouvrirScanner(){

document
.getElementById(
"scannerImmatriculation"
)
.click();

}


async function scannerPhoto(input){

const fichier=input.files[0];

if(!fichier)return;

const status=
document.getElementById(
"scannerStatus"
);

status.style.display="block";

status.style.background="#fff3cd";

status.textContent=
"📷 Analyse de la photo en cours…";

try{

const image=
await chargerImage(fichier);

const images=
creerImagesPourOCR(image);

let resultat="";

for(
let i=0;
i<images.length;
i++
){

status.textContent=
"🔎 Reconnaissance… "+
(i+1)+"/"+
images.length;

const texte=
await reconnaitreTexte(
images[i]
);

const plaque=
extraireImmatriculation(
texte
);

if(plaque){

resultat=plaque;
break;

}

}

if(resultat){

document.getElementById(
"immatriculation"
).value=resultat;

status.style.background=
"#d4edda";

status.textContent=
"✅ Immatriculation reconnue : "+
resultat;

}else{

status.style.background=
"#f8d7da";

status.textContent=
"❌ Plaque non reconnue. "+
"Utilise le champ et le micro du clavier.";

}

}catch(erreur){

console.error(erreur);

status.style.background=
"#f8d7da";

status.textContent=
"❌ Impossible de lire la plaque.";

}

input.value="";

}


/* =====================================================
   OCR
===================================================== */

function chargerImage(fichier){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=e=>{

const img=
new Image();

img.onload=()=>
resolve(img);

img.onerror=reject;

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(
fichier
);

});
}


function creerImagesPourOCR(img){

const largeur=1600;

const ratio=
largeur/img.width;

const hauteur=
Math.round(
img.height*ratio
);

const canvas=
document.createElement(
"canvas"
);

canvas.width=largeur;

canvas.height=hauteur;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
largeur,
hauteur
);

const original=
canvas.toDataURL(
"image/jpeg",
.95
);

const gris=
document.createElement(
"canvas"
);

gris.width=largeur;

gris.height=hauteur;

const g=
gris.getContext("2d");

g.drawImage(
img,
0,
0,
largeur,
hauteur
);

const data=
g.getImageData(
0,
0,
largeur,
hauteur
);

for(
let i=0;
i<data.data.length;
i+=4
){

const r=data.data[i];

const v=data.data[i+1];

const b=data.data[i+2];

let valeur=
.299*r+
.587*v+
.114*b;

valeur=
(valeur-128)*1.6+
128;

valeur=
Math.max(
0,
Math.min(
255,
valeur
)
);

data.data[i]=valeur;
data.data[i+1]=valeur;
data.data[i+2]=valeur;

}

g.putImageData(
data,
0,
0
);

const noirBlanc=
document.createElement(
"canvas"
);

noirBlanc.width=largeur;

noirBlanc.height=hauteur;

const n=
noirBlanc.getContext("2d");

n.drawImage(
gris,
0,
0
);

const d=
n.getImageData(
0,
0,
largeur,
hauteur
);

for(
let i=0;
i<d.data.length;
i+=4
){

const valeur=d.data[i];

const resultat=
valeur>145
?255
:0;

d.data[i]=resultat;
d.data[i+1]=resultat;
d.data[i+2]=resultat;

}

n.putImageData(
d,
0,
0
);

return[
original,
gris.toDataURL(
"image/jpeg",
.95
),
noirBlanc.toDataURL(
"image/jpeg",
.95
)
];

}


async function reconnaitreTexte(image){

const worker=
await Tesseract.createWorker(
"eng"
);

await worker.setParameters({

tessedit_char_whitelist:
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",

tessedit_pageseg_mode:
"7"

});

const resultat=
await worker.recognize(
image
);

const texte=
resultat.data.text||"";

await worker.terminate();

return texte.toUpperCase();

}


function extraireImmatriculation(texte){

const propre=
texte
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
);

const correspondance=
propre.match(
/[A-Z]{2}[0-9]{3}[A-Z]{2}/
);

if(!correspondance)return null;

return formaterPlaque(
correspondance[0]
);

}


/* =====================================================
   FORMAT IMMATRICULATION
===================================================== */

function formatImmatriculation(input){

let valeur=
input.value
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
)
.substring(0,7);

if(valeur.length>2){

valeur=
valeur.substring(0,2)+
"-"+
valeur.substring(2);

}

if(valeur.length>6){

valeur=
valeur.substring(0,6)+
"-"+
valeur.substring(6);

}

input.value=valeur;

}


function formaterPlaque(plaque){

plaque=
plaque
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
);

if(
!/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/
.test(plaque)
){

return null;

}

return(
plaque.substring(0,2)+
"-"+
plaque.substring(2,5)+
"-"+
plaque.substring(5,7)
);

}


function nettoyerImmatriculation(valeur){

valeur=
valeur
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
)
.substring(0,7);

if(valeur.length>2){

valeur=
valeur.substring(0,2)+
"-"+
valeur.substring(2);

}

if(valeur.length>6){

valeur=
valeur.substring(0,6)+
"-"+
valeur.substring(6);

}

return valeur;

}


/* =====================================================
   AJOUTER VÉHICULE
===================================================== */

function ajouterVehicule(){

const input=
document.getElementById(
"immatriculation"
);

const immatriculation=
nettoyerImmatriculation(
input.value
);

if(!immatriculation){

alert(
"Merci de saisir l'immatriculation."
);

return;

}

if(
immatriculation
.replace(/-/g,"")
.length!==7
){

alert(
"L'immatriculation doit contenir 7 caractères."
);

return;

}

if(
vehicules.some(
v=>
v.immatriculation===
immatriculation
)
){

alert(
"Ce véhicule existe déjà."
);

return;

}

vehicules.push({

id:Date.now(),

immatriculation:
immatriculation,

photos:[]

});

sauvegarderVehicules();

input.value="";

afficherVehicules();

}


/* =====================================================
   SAUVEGARDE
===================================================== */

function sauvegarderVehicules(){

localStorage.setItem(
"atelierCarrosserieVehicules",
JSON.stringify(
vehicules
)
);


/* =====================================================
   AFFICHER VÉHICULES
===================================================== */

}

function afficherVehicules(){

const container=
document.getElementById(
"listeVehicules"
);

container.innerHTML="";

if(vehicules.length===0){

container.innerHTML=
'<div class="empty">'+
'Aucun véhicule enregistré.'+
'</div>';

return;

}

vehicules.forEach(
vehicle=>{

const div=
document.createElement(
"div"
);

div.className="vehicle";

div.innerHTML=`

<div class="vehicle-title">
🚗 ${vehicle.immatriculation}
</div>

<label
class="primary"
style="
display:block;
text-align:center;
margin-bottom:8px;
">

📷 Ajouter une photo

<input
type="file"
class="file-input"
accept="image/*"
capture="environment"
onchange="ajouterPhoto(
${vehicle.id},
this
)">

</label>

<div
class="photos"
id="photos-${vehicle.id}">
</div>

<div class="share-buttons">

<button
class="green"
onclick="preparerEmail(
${vehicle.id}
)">
✉️ Préparer l'e-mail
</button>

<button
class="orange"
onclick="partagerPhotos(
${vehicle.id}
)">
📸 Partager les photos
</button>

<button
class="red"
onclick="supprimerVehicule(
${vehicle.id}
)">
🗑️ Supprimer le véhicule
</button>

</div>
`;

container.appendChild(div);

afficherPhotos(vehicle);

});

}


/* =====================================================
   PHOTOS
===================================================== */

function ajouterPhoto(
vehicleId,
input
){

const fichier=
input.files[0];

if(!fichier)return;

const reader=
new FileReader();

reader.onload=
function(event){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

vehicle.photos.push({

image:
event.target.result,

commentaire:""

});

sauvegarderVehicules();

afficherVehicules();

setTimeout(
function(){

ouvrirCommentairePhoto(
vehicle.id,
vehicle.photos.length-1
);

},
300
);

};

reader.readAsDataURL(
fichier
);

input.value="";

}


/* =====================================================
   AFFICHER PHOTOS
===================================================== */

function afficherPhotos(vehicle){

const container=
document.getElementById(
"photos-"+vehicle.id
);

if(!container)return;

container.innerHTML="";

vehicle.photos.forEach(
(photo,index)=>{

if(typeof photo==="string"){

photo={
image:photo,
commentaire:""
};

vehicle.photos[index]=photo;

}

const div=
document.createElement(
"div"
);

div.className="photo-box";

const commentaire=
photo.commentaire||"";

div.innerHTML=`

<img
src="${photo.image}"
alt="Photo du véhicule">

<button
class="delete-photo"
onclick="supprimerPhoto(
${vehicle.id},
${index}
)">
×
</button>

<div class="photo-comment">

${
commentaire
?
"📝 "+
escapeHTML(commentaire)
:
'<span class="photo-comment-empty">'+
'Aucun commentaire'+
'</span>'
}

</div>

<div class="comment-buttons">

<button
class="voice"
onclick="ouvrirCommentairePhoto(
${vehicle.id},
${index}
)">
🎙️ ${
commentaire
?
"Modifier le commentaire"
:
"Commenter cette photo"
}
</button>

</div>

`;

div.innerHTML+=`

<button
class="gray"
style="width:calc(100% - 16px);margin:8px;"
onclick="modifierCommentaire(
${vehicle.id},
${index}
)">
✏️ Modifier le texte
</button>

`;

container.appendChild(div);

});

}


/* =====================================================
   COMMENTAIRE PHOTO AVEC CLAVIER IPHONE
===================================================== */

function ouvrirCommentairePhoto(
vehicleId,
photoIndex
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

const photo=
vehicle.photos[photoIndex];

if(!photo)return;


/*
 * On crée une petite fenêtre
 * directement dans la page.
 */

const overlay=
document.createElement(
"div"
);

overlay.style.position="fixed";
overlay.style.left="0";
overlay.style.top="0";
overlay.style.right="0";
overlay.style.bottom="0";
overlay.style.background="rgba(0,0,0,.5)";
overlay.style.zIndex="9999";
overlay.style.padding="20px";
overlay.style.display="flex";
overlay.style.alignItems="center";
overlay.style.justifyContent="center";


const box=
document.createElement(
"div"
);

box.style.background="white";
box.style.borderRadius="15px";
box.style.padding="15px";
box.style.width="100%";
box.style.maxWidth="500px";


box.innerHTML=`

<h2>📝 Commentaire photo</h2>

<div class="tip">
Appuie sur 🎙️ le micro du clavier
de l'iPhone pour dicter ton commentaire.
</div>

<textarea
id="commentaireTemporaire"
placeholder="Exemple : aile avant gauche rayée"
>${escapeHTML(
photo.commentaire||""
)}</textarea>

<button
class="green"
style="width:100%;"
id="boutonValiderCommentaire">
✅ Enregistrer
</button>

<button
class="gray"
style="width:100%;"
id="boutonAnnulerCommentaire">
Annuler
</button>

`;

overlay.appendChild(box);

document.body.appendChild(
overlay
);


const textarea=
document.getElementById(
"commentaireTemporaire"
);

textarea.focus();

textarea.setSelectionRange(
textarea.value.length,
textarea.value.length
);


document.getElementById(
"boutonValiderCommentaire"
).onclick=function(){

enregistrerCommentaire(
vehicleId,
photoIndex,
textarea.value
);

overlay.remove();

};


document.getElementById(
"boutonAnnulerCommentaire"
).onclick=function(){

overlay.remove();

};

}


/* =====================================================
   ENREGISTRER COMMENTAIRE
===================================================== */

function enregistrerCommentaire(
vehicleId,
photoIndex,
commentaire
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

if(!vehicle.photos[photoIndex])
return;

vehicle.photos[photoIndex]
.commentaire=
commentaire.trim();

sauvegarderVehicules();

afficherVehicules();

}


/* =====================================================
   MODIFIER COMMENTAIRE
===================================================== */

function modifierCommentaire(
vehicleId,
photoIndex
){

ouvrirCommentairePhoto(
vehicleId,
photoIndex
);

}


/* =====================================================
   SUPPRIMER PHOTO
===================================================== */

function supprimerPhoto(
vehicleId,
photoIndex
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

vehicle.photos.splice(
photoIndex,
1
);

sauvegarderVehicules();

afficherVehicules();

}


/* =====================================================
   SUPPRIMER VÉHICULE
===================================================== */

function supprimerVehicule(
vehicleId
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

if(
!confirm(
"Supprimer le véhicule "+
vehicle.immatriculation+
" et toutes ses photos ?"
)
)return;

vehicules=
vehicules.filter(
v=>v.id!==vehicleId
);

sauvegarderVehicules();

afficherVehicules();

}


/* =====================================================
   SÉCURITÉ TEXTE
===================================================== */

function escapeHTML(texte){

return String(texte)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   EMAILS
===================================================== */

function ajouterEmail(){

const input=
document.getElementById(
"nouvelEmail"
);

const email=
input.value
.trim()
.toLowerCase();

if(!email){

alert(
"Merci de saisir une adresse e-mail."
);

return;

}

if(!email.includes("@")){

alert(
"Cette adresse e-mail semble incorrecte."
);

return;

}

if(emails.includes(email)){

alert(
"Cette adresse existe déjà."
);

return;

}

emails.push(email);

sauvegarderEmails();

input.value="";

afficherEmails();

}


function sauvegarderEmails(){

localStorage.setItem(
"atelierCarrosserieEmails",
JSON.stringify(
emails
)
);


}


/* =====================================================
   AFFICHER EMAILS
===================================================== */

function afficherEmails(){

const container=
document.getElementById(
"listeEmails"
);

container.innerHTML="";

if(emails.length===0){

container.innerHTML=
'<div class="empty">'+
'Aucune adresse enregistrée.'+
'</div>';

return;

}

emails.forEach(
(email,index)=>{

const div=
document.createElement(
"div"
);

div.className=
"email-row";

div.innerHTML=`

<label>

<input
type="checkbox"
class="email-checkbox"
value="${escapeHTML(email)}">

${escapeHTML(email)}

</label>

<button
class="small-delete"
onclick="supprimerEmail(
${index}
)">
Supprimer
</button>

`;

container.appendChild(div);

});

}


/* =====================================================
   SUPPRIMER EMAIL
===================================================== */

function supprimerEmail(index){

emails.splice(
index,
1
);

sauvegarderEmails();

afficherEmails();

}


/* =====================================================
   PRÉPARER EMAIL
===================================================== */

function preparerEmail(
vehicleId
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

const cases=
document.querySelectorAll(
".email-checkbox:checked"
);

if(cases.length===0){

alert(
"Sélectionne au moins une adresse e-mail."
);

return;

}

const destinataires=
Array.from(cases)
.map(
c=>c.value
)
.join(",");

const sujet=
"Photos véhicule "+
vehicle.immatriculation;

let corps=
"Bonjour,\n\n"+
"Veuillez trouver les photos du véhicule "+
vehicle.immatriculation+
".\n\n";

vehicle.photos.forEach(
(photo,index)=>{

if(photo.commentaire){

corps+=
"Photo "+
(index+1)+
" : "+
photo.commentaire+
"\n";

}

});

corps+=
"\nCordialement,\n"+
"Atelier Carrosserie Sébie";

window.location.href=
"mailto:"+
destinataires+
"?subject="+
encodeURIComponent(
sujet
)+
"&body="+
encodeURIComponent(
corps
);

}


/* =====================================================
   PARTAGE PHOTOS
===================================================== */

async function partagerPhotos(
vehicleId
){

const vehicle=
vehicules.find(
v=>v.id===vehicleId
);

if(!vehicle)return;

if(vehicle.photos.length===0){

alert(
"Ce véhicule n'a aucune photo."
);

return;

}

try{

const fichiers=[];

for(
let i=0;
i<vehicle.photos.length;
i++
){

const response=
await fetch(
vehicle.photos[i].image
);

const blob=
await response.blob();

fichiers.push(

new File(
[blob],

vehicle.immatriculation+
"-"+
(i+1)+
".jpg",

{
type:
blob.type||
"image/jpeg"
}

)

);

}

let texte=
"Photos du véhicule "+
vehicle.immatriculation;

const commentaires=
vehicle.photos
.filter(
p=>p.commentaire
)
.map(
p=>p.commentaire
);

if(commentaires.length){

texte+=
"\n\n"+
commentaires
.map(
(c,i)=>
"Photo "+
(i+1)+
" : "+
c
)
.join("\n");

}

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:fichiers
})
){

await navigator.share({

title:
"Photos "+
vehicle.immatriculation,

text:texte,

files:fichiers

});

}else if(
navigator.share
){

await navigator.share({

title:
"Photos "+
vehicle.immatriculation,

text:texte

});

}else{

alert(
"Le partage de fichiers n'est pas disponible sur cet appareil."
);

}

}catch(error){

console.log(error);

}

}


/* =====================================================
   DÉMARRAGE
===================================================== */

afficherEmails();

afficherVehicules();

</script>
