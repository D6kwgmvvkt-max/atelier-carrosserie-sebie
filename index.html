
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Carrosserie Sébie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2, h3 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 12px;
      font-size: 17px;
    }

    input {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      font-weight: 600;
    }

    button:active {
      transform: scale(.98);
    }

    .vehicle {
      border-top: 1px solid #ddd;
      padding-top: 18px;
      margin-top: 18px;
    }

    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .photo-box {
      position: relative;
    }

    .photo {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
    }

    .delete-photo {
      font-size: 13px;
      padding: 9px;
      margin-top: 5px;
      background: #555;
    }

    .empty {
      color: #777;
    }

    .info {
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }

    .share {
      background: #222;
    }

    .delete-vehicle {
      background: #777;
    }

    .email-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .email-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      flex-shrink: 0;
    }

    .email-address {
      flex: 1;
      word-break: break-all;
      font-size: 15px;
    }

    .delete-email {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #777;
      font-size: 13px;
    }

    .copy-button {
      background: #444;
    }

    .selected-info {
      margin-top: 12px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>Atelier Carrosserie Sébie</h1>
  <p>Gestion des véhicules</p>
</header>

<main>

  <!-- NOUVEAU VEHICULE -->

  <div class="card">

    <h2>🚗 Nouveau véhicule</h2>

    <p class="info">
      Appuie dans le champ puis utilise le 🎙️ du clavier
      de l’iPhone pour dicter l’immatriculation.
    </p>

    <input
      id="immatriculation"
      type="text"
      placeholder="Exemple : AB 123 CD"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <button onclick="creerVehicule()">
      Créer le dossier
    </button>

  </div>


  <!-- ADRESSES EMAIL -->

  <div class="card">

    <h2>📧 Adresses e-mail</h2>

    <p class="info">
      Enregistre ici les adresses auxquelles tu envoies
      régulièrement les photos.
    </p>

    <input
      id="emailInput"
      type="email"
      placeholder="adresse@exemple.fr"
      autocomplete="email"
    >

    <button onclick="ajouterEmail()">
      ➕ Ajouter l’adresse
    </button>

    <div id="listeEmails"></div>

    <button
      class="copy-button"
      onclick="copierDestinataires()"
    >
      📋 Copier les destinataires sélectionnés
    </button>

  </div>


  <!-- DOSSIERS -->

  <div class="card">

    <h2>📋 Dossiers véhicules</h2>

    <div id="listeVehicules"></div>

  </div>

</main>


<script>

  /* =========================
     VEHICULES
  ========================= */

  let vehicules = JSON.parse(
    localStorage.getItem(
      "atelierCarrosserieVehicules"
    ) || "[]"
  );


  /* =========================
     EMAILS
  ========================= */

  let emails = JSON.parse(
    localStorage.getItem(
      "atelierCarrosserieEmails"
    ) || "[]"
  );


  /* =========================
     SAUVEGARDE
  ========================= */

  function sauvegarder() {

    localStorage.setItem(
      "atelierCarrosserieVehicules",
      JSON.stringify(vehicules)
    );
  }


  function sauvegarderEmails() {

    localStorage.setItem(
      "atelierCarrosserieEmails",
      JSON.stringify(emails)
    );
  }


  /* =========================
     IMMATRICULATION
  ========================= */

  function nettoyerImmatriculation(texte) {

    return texte
      .toUpperCase()
      .replace(/\s+/g, " ")
      .trim();
  }


  /* =========================
     CREER VEHICULE
  ========================= */

  function creerVehicule() {

    const champ =
      document.getElementById(
        "immatriculation"
      );

    const immatriculation =
      nettoyerImmatriculation(
        champ.value
      );

    if (!immatriculation) {

      alert(
        "Dicte ou saisis l’immatriculation."
      );

      champ.focus();

      return;
    }


    const existe =
      vehicules.some(
        v =>
          v.immatriculation ===
          immatriculation
      );


    if (existe) {

      alert(
        "Ce véhicule existe déjà."
      );

      return;
    }


    vehicules.push({

      id: Date.now(),

      immatriculation:
        immatriculation,

      photos: []

    });


    sauvegarder();

    champ.value = "";

    afficherVehicules();
  }


  /* =========================
     AJOUTER PHOTO
  ========================= */

  function ajouterPhoto(
    index,
    input
  ) {

    const fichier =
      input.files[0];

    if (!fichier) {
      return;
    }


    const lecteur =
      new FileReader();


    lecteur.onload =
      function(event) {

        vehicules[index].photos.push({

          nom:
            "photo-" +
            Date.now() +
            ".jpg",

          data:
            event.target.result

        });


        sauvegarder();

        afficherVehicules();
      };


    lecteur.readAsDataURL(
      fichier
    );
  }


  /* =========================
     SUPPRIMER PHOTO
  ========================= */

  function supprimerPhoto(
    vehiculeIndex,
    photoIndex
  ) {

    vehicules[
      vehiculeIndex
    ].photos.splice(
      photoIndex,
      1
    );


    sauvegarder();

    afficherVehicules();
  }


  /* =========================
     SUPPRIMER VEHICULE
  ========================= */

  function supprimerVehicule(
    index
  ) {

    const plaque =
      vehicules[index]
        .immatriculation;


    if (
      !confirm(
        "Supprimer le dossier " +
        plaque +
        " ?"
      )
    ) {

      return;
    }


    vehicules.splice(
      index,
      1
    );


    sauvegarder();

    afficherVehicules();
  }


  /* =========================
     AJOUTER EMAIL
  ========================= */

  function ajouterEmail() {

    const champ =
      document.getElementById(
        "emailInput"
      );

    const email =
      champ.value
        .trim()
        .toLowerCase();


    if (!email) {

      alert(
        "Saisis une adresse e-mail."
      );

      champ.focus();

      return;
    }


    /*
      Vérification simple
    */

    if (
      !email.includes("@") ||
      !email.includes(".")
    ) {

      alert(
        "Cette adresse e-mail semble incorrecte."
      );

      return;
    }


    if (
      emails.includes(email)
    ) {

      alert(
        "Cette adresse est déjà enregistrée."
      );

      champ.value = "";

      return;
    }


    emails.push(email);

    sauvegarderEmails();

    champ.value = "";

    afficherEmails();
  }


  /* =========================
     SUPPRIMER EMAIL
  ========================= */

  function supprimerEmail(
    index
  ) {

    const email =
      emails[index];


    if (
      !confirm(
        "Supprimer l’adresse " +
        email +
        " ?"
      )
    ) {

      return;
    }


    emails.splice(
      index,
      1
    );


    sauvegarderEmails();

    afficherEmails();
  }


  /* =========================
     AFFICHER EMAILS
  ========================= */

  function afficherEmails() {

    const liste =
      document.getElementById(
        "listeEmails"
      );


    liste.innerHTML = "";


    if (!emails.length) {

      liste.innerHTML =
        '<p class="empty">' +
        'Aucune adresse enregistrée.' +
        '</p>';

      return;
    }


    emails.forEach(
      (email, index) => {

        const bloc =
          document.createElement(
            "div"
          );


        bloc.className =
          "email-item";


        bloc.innerHTML = `

          <input
            type="checkbox"
            class="email-checkbox"
            value="${email}"
          >

          <span class="email-address">
            ${email}
          </span>

          <button
            class="delete-email"
            onclick="
              supprimerEmail(${index})
            "
          >
            🗑️
          </button>

        `;


        liste.appendChild(
          bloc
        );
      }
    );
  }


  /* =========================
     EMAILS SELECTIONNES
  ========================= */

  function obtenirEmailsSelectionnes() {

    const cases =
      document.querySelectorAll(
        ".email-checkbox:checked"
      );


    return Array.from(
      cases
    ).map(
      checkbox =>
        checkbox.value
    );
  }


  /* =========================
     COPIER DESTINATAIRES
  ========================= */

  async function copierDestinataires() {

    const selection =
      obtenirEmailsSelectionnes();


    if (!selection.length) {

      alert(
        "Sélectionne au moins une adresse e-mail."
      );

      return;
    }


    const texte =
      selection.join("; ");


    try {

      await navigator.clipboard.writeText(
        texte
      );


      alert(
        "Destinataires copiés.\n\n" +
        "Tu peux maintenant les coller " +
        "dans le champ « À » de Mail."
      );

    } catch (erreur) {

      alert(
        "Impossible de copier automatiquement " +
        "les adresses."
      );
    }
  }


  /* =========================
     PARTAGER PHOTOS
  ========================= */

  async function partagerPhotos(
    index
  ) {

    const vehicule =
      vehicules[index];


    if (
      !vehicule.photos.length
    ) {

      alert(
        "Il n’y a aucune photo dans ce dossier."
      );

      return;
    }


    /*
      Récupération des destinataires
    */

    const destinataires =
      obtenirEmailsSelectionnes();


    /*
      Si des adresses sont sélectionnées,
      on les copie automatiquement.
    */

    if (destinataires.length) {

      try {

        await navigator.clipboard.writeText(
          destinataires.join("; ")
        );

      } catch (erreur) {

        // On continue même si la copie échoue.
      }
    }


    /*
      Transformation des photos
      en fichiers partageables.
    */

    const fichiers = [];


    for (
      let i = 0;
      i < vehicule.photos.length;
      i++
    ) {

      const photo =
        vehicule.photos[i];


      const reponse =
        await fetch(
          photo.data
        );


      const blob =
        await reponse.blob();


      fichiers.push(
        new File(
          [blob],
          photo.nom,
          {
            type:
              blob.type ||
              "image/jpeg"
          }
        )
      );
    }


    /*
      Partage iPhone
    */

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files: fichiers
      })
    ) {

      try {

        let texte =
          "Photos du véhicule " +
          vehicule.immatriculation;


        if (
          destinataires.length
        ) {

          texte +=
            "\n\nDestinataires copiés : " +
            destinataires.join(
              "; "
            );
        }


        await navigator.share({

          title:
            "Photos " +
            vehicule.immatriculation,

          text:
            texte,

          files:
            fichiers

        });


      } catch (erreur) {

        /*
          L'utilisateur a fermé
          la fenêtre de partage.
        */
      }


    } else {

      alert(
        "Le partage des photos n’est pas disponible " +
        "dans ce navigateur."
      );
    }
  }


  /* =========================
     AFFICHER VEHICULES
  ========================= */

  function afficherVehicules() {

    const liste =
      document.getElementById(
        "listeVehicules"
      );


    liste.innerHTML = "";


    if (!vehicules.length) {

      liste.innerHTML =
        '<p class="empty">' +
        'Aucun dossier véhicule.' +
        '</p>';

      return;
    }


    vehicules.forEach(
      (
        vehicule,
        index
      ) => {

        const bloc =
          document.createElement(
            "div"
          );


        bloc.className =
          "vehicle";


        let html = `

          <h3>
            🚘 ${vehicule.immatriculation}
          </h3>

          <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="
              ajouterPhoto(
                ${index},
                this
              )
            "
          >

          <button
            class="share"
            onclick="
              partagerPhotos(
                ${index}
              )
            "
          >
            📧 Envoyer / partager les photos
          </button>

        `;


        if (
          vehicule.photos.length === 0
        ) {

          html += `

            <p class="info">
              Aucune photo dans ce dossier.
            </p>

          `;

        } else {

          html += `

            <p class="info">
              ${vehicule.photos.length}
              photo(s)
            </p>

            <div class="photos">

          `;


          vehicule.photos.forEach(
            (
              photo,
              photoIndex
            ) => {

              html += `

                <div class="photo-box">

                  <img
                    class="photo"
                    src="${photo.data}"
                    alt="Photo du véhicule"
                  >

                  <button
                    class="delete-photo"
                    onclick="
                      supprimerPhoto(
                        ${index},
                        ${photoIndex}
                      )
                    "
                  >
                    🗑️ Supprimer
                  </button>

                </div>

              `;
            }
          );


          html += `

            </div>

          `;
        }


        html += `

          <button
            class="delete-vehicle"
            onclick="
              supprimerVehicule(
                ${index}
              )
            "
          >
            🗑️ Supprimer le dossier
          </button>

        `;


        bloc.innerHTML =
          html;


        liste.appendChild(
          bloc
        );
      }
    );
  }


  /* =========================
     DEMARRAGE
  ========================= */

  afficherEmails();

  afficherVehicules();

</script>

</body>
</html>
