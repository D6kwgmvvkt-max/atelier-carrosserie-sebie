<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Carrosserie Sébie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 12px;
      font-size: 17px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      font-weight: 600;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .photos img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    .vehicle {
      border-top: 1px solid #ddd;
      margin-top: 15px;
      padding-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>Atelier Carrosserie Sébie</h1>
  <p>Gestion de l'atelier</p>
</header>

<main>

  <div class="card">
    <h2>🚗 Nouveau véhicule</h2>

    <input
      id="immatriculation"
      type="text"
      placeholder="Immatriculation"
    >

    <button onclick="ajouterVehicule()">
      Ajouter le véhicule
    </button>
  </div>

  <div class="card">
    <h2>📋 Véhicules</h2>
    <div id="listeVehicules"></div>
  </div>

</main>

<script>

let vehicules = JSON.parse(
  localStorage.getItem("vehicules") || "[]"
);

function sauvegarder() {
  localStorage.setItem(
    "vehicules",
    JSON.stringify(vehicules)
  );
}

function ajouterVehicule() {

  const immatriculation =
    document.getElementById("immatriculation").value.trim();

  if (!immatriculation) {
    alert("Indique l'immatriculation.");
    return;
  }

  vehicules.push({
    immatriculation: immatriculation,
    photos: []
  });

  sauvegarder();

  document.getElementById("immatriculation").value = "";

  afficherVehicules();
}

function ajouterPhoto(index, input) {

  const fichier = input.files[0];

  if (!fichier) return;

  const lecteur = new FileReader();

  lecteur.onload = function(e) {

    vehicules[index].photos.push(e.target.result);

    sauvegarder();
    afficherVehicules();
  };

  lecteur.readAsDataURL(fichier);
}

function supprimerPhoto(vehiculeIndex, photoIndex) {

  vehicules[vehiculeIndex].photos.splice(
    photoIndex,
    1
  );

  sauvegarder();
  afficherVehicules();
}

function partagerPhotos(index) {

  const photos = vehicules[index].photos;

  if (!photos.length) {
    alert("Aucune photo à partager.");
    return;
  }

  alert(
    "Les photos sont enregistrées dans ce dossier. " +
    "Nous ajouterons ensuite le bouton de partage vers Mail."
  );
}

function afficherVehicules() {

  const liste =
    document.getElementById("listeVehicules");

  liste.innerHTML = "";

  if (!vehicules.length) {

    liste.innerHTML =
      "<p>Aucun véhicule enregistré.</p>";

    return;
  }

  vehicules.forEach((vehicule, index) => {

    const bloc =
      document.createElement("div");

    bloc.className = "vehicle";

    let html = `
      <h3>🚘 ${vehicule.immatriculation}</h3>

      <input
        type="file"
        accept="image/*"
        capture="environment"
        onchange="ajouterPhoto(${index}, this)"
      >

      <button onclick="partagerPhotos(${index})">
        📧 Partager les photos
      </button>

      <div class="photos">
    `;

    vehicule.photos.forEach((photo, photoIndex) => {

      html += `
        <div>
          <img src="${photo}">
          <button
            onclick="supprimerPhoto(${index}, ${photoIndex})"
          >
            🗑️ Supprimer
          </button>
        </div>
      `;

    });

    html += "</div>";

    bloc.innerHTML = html;

    liste.appendChild(bloc);
  });
}

afficherVehicules();

</script>

</body>
</html>
