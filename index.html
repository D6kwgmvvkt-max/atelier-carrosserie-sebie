<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Atelier Carrosserie Sébie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f2f2f7;
      color: #111;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 20px;
      padding-bottom: 50px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 20px;
      text-transform: uppercase;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #007aff;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
    }

    .primary {
      background: #007aff;
      color: white;
    }

    .secondary {
      background: #e5e5ea;
      color: #111;
    }

    .danger {
      background: #ff3b30;
      color: white;
    }

    .success {
      background: #34c759;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .scan-button {
      background: #111;
      color: white;
      font-size: 19px;
      padding: 17px;
    }

    .scan-icon {
      font-size: 24px;
      margin-right: 6px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 15px;
    }

    .status.info {
      display: block;
      background: #e8f2ff;
      color: #0055aa;
    }

    .status.success {
      display: block;
      background: #e8f8ec;
      color: #147a2e;
    }

    .status.error {
      display: block;
      background: #ffe8e6;
      color: #c00;
    }

    .vehicle {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .vehicle-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .vehicle-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .vehicle-buttons button {
      width: auto;
      flex: 1;
      min-width: 120px;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .photos img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      background: #ddd;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .separator {
      height: 1px;
      background: #ddd;
      margin: 20px 0;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🚗 Atelier Carrosserie Sébie</h1>

  <!-- NOUVEAU DOSSIER -->
  <div class="card">

    <h2>Créer un dossier</h2>

    <label for="immatriculation">
      Immatriculation
    </label>

    <input
      id="immatriculation"
      type="text"
      placeholder="Exemple : AB 123 CD"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <!-- BOUTON OCR -->
    <button
      class="scan-button"
      type="button"
      onclick="ouvrirScanner()"
    >
      <span class="scan-icon">📷</span>
      Scanner l'immatriculation
    </button>

    <!-- INPUT PHOTO INVISIBLE -->
    <input
      id="photoOCR"
      type="file"
      accept="image/*"
      capture="environment"
      class="hidden"
      onchange="scannerImmatriculation(event)"
    >

    <div id="ocrStatus" class="status"></div>

    <button
      class="primary"
      type="button"
      onclick="creerVehicule()"
    >
      Créer le dossier
    </button>

    <div class="small">
      Tu peux soit saisir l'immatriculation manuellement,
      soit appuyer sur « Scanner » et photographier la plaque.
    </div>

  </div>


  <!-- DOSSIERS -->
  <div class="card">

    <h2>Dossiers véhicules</h2>

    <div id="listeVehicules"></div>

  </div>


  <!-- DOSSIER ACTUEL -->
  <div
    id="dossierActuel"
    class="card hidden"
  >

    <h2 id="titreDossier"></h2>

    <div class="separator"></div>

    <button
      class="primary"
      type="button"
      onclick="prendrePhoto()"
    >
      📷 Ajouter une photo
    </button>

    <input
      id="photoVehicule"
      type="file"
      accept="image/*"
      capture="environment"
      class="hidden"
      onchange="ajouterPhoto(event)"
    >

    <button
      class="secondary"
      type="button"
      onclick="preparerEmail()"
    >
      ✉️ Préparer un e-mail
    </button>

    <div id="photosVehicule" class="photos"></div>

    <button
      class="danger"
      type="button"
      onclick="fermerDossier()"
    >
      Fermer le dossier
    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION OCR.SPACE
   ========================================================= */

const OCR_API_KEY = "K89493204488957";

const OCR_URL = "https://api.ocr.space/parse/image";


/* =========================================================
   VARIABLES
   ========================================================= */

let vehicules = JSON.parse(
  localStorage.getItem("atelierCarrosserieVehicules") || "[]"
);

let vehiculeActuelId = null;


/* =========================================================
   NETTOYAGE IMMATRICULATION
   ========================================================= */

function nettoyerImmatriculation(texte) {

  if (!texte) {
    return "";
  }

  return texte
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .trim();
}


/* =========================================================
   FORMATAGE IMMATRICULATION
   ========================================================= */

function formatImmatriculation(texte) {

  const propre = nettoyerImmatriculation(texte);

  /*
    Format français classique :
    AB123CD
    devient :
    AB 123 CD
  */

  if (/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(propre)) {

    return propre.substring(0,2)
      + " "
      + propre.substring(2,5)
      + " "
      + propre.substring(5,7);
  }

  return propre;
}


/* =========================================================
   OUVRIR LE SCANNER
   ========================================================= */

function ouvrirScanner() {

  const input = document.getElementById("photoOCR");

  input.value = "";

  input.click();
}


/* =========================================================
   SCANNER IMMATRICULATION AVEC OCR.SPACE
   ========================================================= */

async function scannerImmatriculation(event) {

  const file = event.target.files[0];

  if (!file) {
    return;
  }

  afficherOCRStatus(
    "📷 Analyse de la photo en cours...",
    "info"
  );

  try {

    /*
      On limite la taille de l'image.
      Cela permet d'envoyer plus rapidement la photo.
    */

    const image = await redimensionnerImage(file);

    const formData = new FormData();

    formData.append(
      "file",
      image,
      "plaque.jpg"
    );

    formData.append(
      "language",
      "eng"
    );

    formData.append(
      "isOverlayRequired",
      "false"
    );

    /*
      Engine 2 est particulièrement adapté
      aux caractères alphanumériques.
    */

    formData.append(
      "OCREngine",
      "2"
    );


    const response = await fetch(
      OCR_URL,
      {
        method: "POST",

        headers: {
          "apikey": OCR_API_KEY
        },

        body: formData
      }
    );


    if (!response.ok) {

      throw new Error(
        "Erreur réseau OCR : " + response.status
      );
    }


    const data = await response.json();


    console.log(
      "Réponse OCR.space :",
      data
    );


    if (
      data.IsErroredOnProcessing ||
      !data.ParsedResults ||
      data.ParsedResults.length === 0
    ) {

      let message = "Impossible de lire l'immatriculation.";

      if (data.ErrorMessage) {

        if (Array.isArray(data.ErrorMessage)) {
          message += " " + data.ErrorMessage.join(" ");
        } else {
          message += " " + data.ErrorMessage;
        }

      }

      throw new Error(message);
    }


    /*
      Récupération de tout le texte détecté.
    */

    let texteOCR = "";

    data.ParsedResults.forEach(result => {

      if (result.ParsedText) {
        texteOCR += " " + result.ParsedText;
      }

    });


    console.log(
      "Texte OCR :",
      texteOCR
    );


    /*
      Recherche d'une plaque française.
    */

    const plaque = trouverImmatriculation(texteOCR);


    if (!plaque) {

      /*
        Si le moteur ne retrouve pas exactement
        le format français, on met quand même
        le texte nettoyé dans le champ.
      */

      const secours = nettoyerImmatriculation(texteOCR);

      if (secours.length >= 5) {

        document.getElementById(
          "immatriculation"
        ).value = formatImmatriculation(secours);

        afficherOCRStatus(
          "⚠️ Texte détecté. Vérifie l'immatriculation avant de créer le dossier.",
          "info"
        );

        return;
      }


      throw new Error(
        "Aucune immatriculation lisible n'a été trouvée."
      );
    }


    document.getElementById(
      "immatriculation"
    ).value = formatImmatriculation(plaque);


    afficherOCRStatus(
      "✅ Immatriculation détectée : " +
      formatImmatriculation(plaque),
      "success"
    );


  } catch (error) {

    console.error(error);

    afficherOCRStatus(
      "❌ " + error.message,
      "error"
    );

  }

}


/* =========================================================
   TROUVER UNE IMMATRICULATION FRANÇAISE
   ========================================================= */

function trouverImmatriculation(texte) {

  if (!texte) {
    return null;
  }

  let propre = texte
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");


  /*
    Format SIV français :
    AA123AA
  */

  let match = propre.match(
    /[A-Z]{2}\d{3}[A-Z]{2}/
  );

  if (match) {
    return match[0];
  }


  /*
    Deuxième tentative :
    OCR peut parfois lire un caractère
    avec un espace ou un retour à la ligne.
  */

  const candidats = texte
    .toUpperCase()
    .split(/\s+/)
    .map(x =>
      x.replace(/[^A-Z0-9]/g, "")
    )
    .filter(x => x.length > 0);


  /*
    On regarde les combinaisons de morceaux.
  */

  for (let i = 0; i < candidats.length; i++) {

    for (
      let j = i;
      j < Math.min(i + 3, candidats.length);
      j++
    ) {

      const combinaison =
        candidats
          .slice(i, j + 1)
          .join("");

      const resultat =
        combinaison.match(
          /[A-Z]{2}\d{3}[A-Z]{2}/
        );

      if (resultat) {
        return resultat[0];
      }

    }

  }


  return null;
}


/* =========================================================
   REDIMENSIONNER IMAGE
   ========================================================= */

function redimensionnerImage(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function(e) {

      const img = new Image();

      img.onload = function() {

        const MAX = 1600;

        let width = img.width;
        let height = img.height;


        if (width > MAX || height > MAX) {

          if (width > height) {

            height =
              Math.round(
                height * MAX / width
              );

            width = MAX;

          } else {

            width =
              Math.round(
                width * MAX / height
              );

            height = MAX;
          }

        }


        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;


        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        canvas.toBlob(
          blob => {

            if (!blob) {

              reject(
                new Error(
                  "Impossible de préparer la photo."
                )
              );

              return;
            }

            resolve(blob);

          },
          "image/jpeg",
          0.90
        );

      };


      img.onerror = function() {

        reject(
          new Error(
            "Impossible de lire la photo."
          )
        );

      };


      img.src = e.target.result;

    };


    reader.onerror = function() {

      reject(
        new Error(
          "Impossible de charger la photo."
        )
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================================================
   MESSAGE OCR
   ========================================================= */

function afficherOCRStatus(message, type) {

  const element =
    document.getElementById("ocrStatus");

  element.textContent = message;

  element.className =
    "status " + type;

}


/* =========================================================
   CRÉER VÉHICULE
   ========================================================= */

function creerVehicule() {

  const input =
    document.getElementById("immatriculation");

  const valeur =
    nettoyerImmatriculation(input.value);


  if (!valeur) {

    alert(
      "Veuillez saisir ou scanner une immatriculation."
    );

    return;
  }


  const existe =
    vehicules.find(
      v => v.immatriculation === valeur
    );


  if (existe) {

    alert(
      "Un dossier existe déjà pour cette immatriculation."
    );

    ouvrirDossier(existe.id);

    return;
  }


  const vehicule = {

    id: Date.now(),

    immatriculation: valeur,

    photos: [],

    dateCreation:
      new Date().toISOString()

  };


  vehicules.push(vehicule);

  sauvegarder();


  input.value = "";

  afficherOCRStatus(
    "",
    ""
  );


  afficherVehicules();

  ouvrirDossier(vehicule.id);

}


/* =========================================================
   SAUVEGARDER
   ========================================================= */

function sauvegarder() {

  localStorage.setItem(
    "atelierCarrosserieVehicules",
    JSON.stringify(vehicules)
  );

}


/* =========================================================
   AFFICHER LES DOSSIERS
   ========================================================= */

function afficherVehicules() {

  const container =
    document.getElementById(
      "listeVehicules"
    );


  container.innerHTML = "";


  if (vehicules.length === 0) {

    container.innerHTML =
      '<div class="empty">Aucun dossier pour le moment.</div>';

    return;
  }


  /*
    Plus récent en premier.
  */

  const liste =
    [...vehicules].reverse();


  liste.forEach(vehicule => {

    const div =
      document.createElement("div");

    div.className = "vehicle";


    const titre =
      document.createElement("div");

    titre.className =
      "vehicle-title";

    titre.textContent =
      formatImmatriculation(
        vehicule.immatriculation
      );


    const infos =
      document.createElement("div");

    infos.className =
      "small";

    infos.textContent =
      vehicule.photos.length +
      " photo(s)";


    const boutons =
      document.createElement("div");

    boutons.className =
      "vehicle-buttons";


    const ouvrir =
      document.createElement("button");

    ouvrir.className =
      "primary";

    ouvrir.textContent =
      "Ouvrir";

    ouvrir.onclick = function() {

      ouvrirDossier(vehicule.id);

    };


    const supprimer =
      document.createElement("button");

    supprimer.className =
      "danger";

    supprimer.textContent =
      "Supprimer";

    supprimer.onclick = function() {

      supprimerVehicule(vehicule.id);

    };


    boutons.appendChild(ouvrir);

    boutons.appendChild(supprimer);


    div.appendChild(titre);

    div.appendChild(infos);

    div.appendChild(boutons);


    container.appendChild(div);

  });

}


/* =========================================================
   OUVRIR DOSSIER
   ========================================================= */

function ouvrirDossier(id) {

  const vehicule =
    vehicules.find(
      v => v.id === id
    );


  if (!vehicule) {
    return;
  }


  vehiculeActuelId =
    id;


  document.getElementById(
    "dossierActuel"
  ).classList.remove("hidden");


  document.getElementById(
    "titreDossier"
  ).textContent =
    "Dossier : " +
    formatImmatriculation(
      vehicule.immatriculation
    );


  afficherPhotos();


  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* =========================================================
   FERMER DOSSIER
   ========================================================= */

function fermerDossier() {

  vehiculeActuelId =
    null;

  document.getElementById(
    "dossierActuel"
  ).classList.add("hidden");

}


/* =========================================================
   PRENDRE PHOTO
   ========================================================= */

function prendrePhoto() {

  if (!vehiculeActuelId) {
    return;
  }

  const input =
    document.getElementById(
      "photoVehicule"
    );

  input.value = "";

  input.click();

}


/* =========================================================
   AJOUTER PHOTO
   ========================================================= */

function ajouterPhoto(event) {

  const file =
    event.target.files[0];


  if (!file || !vehiculeActuelId) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    const vehicule =
      vehicules.find(
        v => v.id === vehiculeActuelId
      );


    if (!vehicule) {
      return;
    }


    vehicule.photos.push(
      e.target.result
    );


    sauvegarder();

    afficherPhotos();

    afficherVehicules();

  };


  reader.readAsDataURL(file);

}


/* =========================================================
   AFFICHER PHOTOS
   ========================================================= */

function afficherPhotos() {

  const container =
    document.getElementById(
      "photosVehicule"
    );


  container.innerHTML = "";


  const vehicule =
    vehicules.find(
      v => v.id === vehiculeActuelId
    );


  if (!vehicule) {
    return;
  }


  vehicule.photos.forEach(
    (photo, index) => {

      const wrapper =
        document.createElement("div");


      const img =
        document.createElement("img");

      img.src =
        photo;

      img.alt =
        "Photo véhicule";


      img.onclick =
        function() {

          supprimerPhoto(index);

        };


      wrapper.appendChild(img);

      container.appendChild(wrapper);

    }
  );


  if (vehicule.photos.length > 0) {

    const info =
      document.createElement("div");

    info.className =
      "small";

    info.style.gridColumn =
      "1 / -1";

    info.textContent =
      "Appuie sur une photo pour la supprimer.";

    container.appendChild(info);

  }

}


/* =========================================================
   SUPPRIMER PHOTO
   ========================================================= */

function supprimerPhoto(index) {

  if (!vehiculeActuelId) {
    return;
  }


  if (
    !confirm(
      "Supprimer cette photo ?"
    )
  ) {
    return;
  }


  const vehicule =
    vehicules.find(
      v => v.id === vehiculeActuelId
    );


  if (!vehicule) {
    return;
  }


  vehicule.photos.splice(
    index,
    1
  );


  sauvegarder();

  afficherPhotos();

  afficherVehicules();

}


/* =========================================================
   SUPPRIMER VÉHICULE
   ========================================================= */

function supprimerVehicule(id) {

  const vehicule =
    vehicules.find(
      v => v.id === id
    );


  if (!vehicule) {
    return;
  }


  const ok =
    confirm(
      "Supprimer définitivement le dossier " +
      formatImmatriculation(
        vehicule.immatriculation
      ) +
      " ?"
    );


  if (!ok) {
    return;
  }


  vehicules =
    vehicules.filter(
      v => v.id !== id
    );


  sauvegarder();

  afficherVehicules();


  if (vehiculeActuelId === id) {
    fermerDossier();
  }

}


/* =========================================================
   PRÉPARER EMAIL
   ========================================================= */

function preparerEmail() {

  const vehicule =
    vehicules.find(
      v => v.id === vehiculeActuelId
    );


  if (!vehicule) {
    return;
  }


  const immat =
    formatImmatriculation(
      vehicule.immatriculation
    );


  const sujet =
    "Dossier véhicule " + immat;


  const corps =
    "Bonjour,%0D%0A%0D%0A" +
    "Voici le dossier du véhicule " +
    immat +
    ".%0D%0A%0D%0A" +
    "Nombre de photos : " +
    vehicule.photos.length +
    "%0D%0A%0D%0A" +
    "Atelier Carrosserie Sébie";


  window.location.href =
    "mailto:?subject=" +
    encodeURIComponent(sujet) +
    "&body=" +
    corps;

}


/* =========================================================
   INITIALISATION
   ========================================================= */

afficherVehicules();


/* =========================================================
   FORMATAGE AUTOMATIQUE DU CHAMP
   ========================================================= */

document
  .getElementById("immatriculation")
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );

</script>

</body>
</html>
