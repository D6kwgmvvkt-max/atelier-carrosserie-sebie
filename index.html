<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Carrosserie Sébie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      background: #111;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <header>
    <h1>Atelier Carrosserie Sébie</h1>
    <p>Gestion de l'atelier</p>
  </header>

  <main>

    <div class="card">
      <h2>🚗 Véhicules</h2>
      <p>Gérer les véhicules pris en charge par l'atelier.</p>
      <button onclick="alert('Fonction Véhicules à venir')">
        Gérer les véhicules
      </button>
    </div>

    <div class="card">
      <h2>📋 Dossiers</h2>
      <p>Créer et suivre les dossiers clients.</p>
      <button onclick="alert('Fonction Dossiers à venir')">
        Voir les dossiers
      </button>
    </div>

    <div class="card">
      <h2>👤 Clients</h2>
      <p>Retrouver les informations des clients.</p>
      <button onclick="alert('Fonction Clients à venir')">
        Gérer les clients
      </button>
    </div>

  </main>

</body>
</html>
